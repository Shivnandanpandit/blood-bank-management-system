services:

  backend:
    build: ./backend
    container_name: bbms-backend
    restart: unless-stopped

    env_file:
      - ./backend/.env

    expose:
      - "5000"

  frontend:
    build: ./frontend
    container_name: bbms-frontend
    restart: unless-stopped

    ports:
      - "8080:80"

    depends_on:
      - backend